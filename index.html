<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Médiathèque</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="menuBtn" aria-label="Rechercher" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a href="#" class="logo" id="logoLink">
      <svg class="logo-icon" viewBox="0 0 90 20"><rect width="90" height="20" rx="4" fill="#FF0000"/><path d="M36 6l10 4-10 4V6z" fill="#fff"/></svg>
      <span>Médiathèque</span>
    </a>
  </div>

  <div class="topbar-center" id="topbarCenter">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher dans la bibliothèque" autocomplete="off">
      <button class="search-btn" aria-label="Rechercher">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="topbar-right">
    <a class="topbar-link" href="tags.html" title="Gérer les suggestions de tags">Tags</a>
    <a class="topbar-link" href="delete.html" title="Voir les vidéos notées sous 3 étoiles">À supprimer</a>
    <label class="sort-label" for="sortSelect">Trier</label>
    <select id="sortSelect">
      <option value="date_desc">Plus récent</option>
      <option value="date_asc">Plus ancien</option>
      <option value="title_asc">Titre A-Z</option>
      <option value="size_desc">Taille</option>
      <option value="rating_desc">Mieux notées</option>
      <option value="rating_asc">Moins bien notées</option>
      <option value="rating_5">5 étoiles</option>
      <option value="rating_4">4 étoiles et +</option>
      <option value="rating_3">3 étoiles et +</option>
    </select>
  </div>
</header>

<main id="app">

  <!-- Vue grille -->
  <section id="gridView" class="grid-view">
    <div id="videoGrid" class="video-grid"></div>
    <div id="emptyState" class="empty-state" hidden>
      <svg viewBox="0 0 120 90" width="120" height="90"><rect x="10" y="15" width="100" height="60" rx="6" fill="none" stroke="#606060" stroke-width="3"/><path d="M48 35l24 15-24 15V35z" fill="#606060"/></svg>
      <p>Aucune vidéo trouvée dans <code>/media/library</code></p>
    </div>
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Chargement de la bibliothèque…</p>
    </div>
  </section>

  <!-- Vue lecteur -->
  <section id="playerView" class="player-view" hidden>
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Retour à la bibliothèque
    </button>

    <div class="player-layout">
      <div class="player-main">
        <div class="video-wrapper">
          <video id="mainVideo" controls playsinline></video>
        </div>
        <h1 class="player-title" id="playerTitle"></h1>
        <div class="player-navigation" aria-label="Navigation aléatoire">
          <button class="player-nav-btn" id="previousBtn" title="Revenir à la vidéo précédente" aria-label="Vidéo précédente">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Précédente</span>
          </button>
          <button class="player-nav-btn shuffle-btn" id="shuffleBtn" title="Activer ou désactiver la lecture aléatoire" aria-label="Lecture aléatoire">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 7h3c2.5 0 3.5 2 5 5s2.5 5 5 5h4M16 21h5v-5M4 17h3c1.2 0 2.2-.5 3-1.5M14 8c.8-1 1.8-1 3-1h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Aléatoire</span>
          </button>
          <button class="player-nav-btn" id="discoverBtn" title="Privilégier les vidéos jamais notées, puis les mieux notées" aria-label="Activer ou désactiver le mode découverte" aria-pressed="false">
            <span>Discover</span>
          </button>
          <button class="player-nav-btn" id="nextBtn" title="Lire la vidéo suivante" aria-label="Vidéo suivante">
            <span>Suivante</span>
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="player-tags" id="playerTags" aria-label="Tags de la vidéo"></div>
        <div class="player-meta">
          <span id="playerDate"></span>
          <span class="dot">•</span>
          <span id="playerSize"></span>
          <span class="dot">•</span>
          <span id="playerDuration"></span>
          <span class="dot">•</span>
          <span id="playerRating"></span>
        </div>
      </div>

      <aside class="up-next">
        <h2>À suivre</h2>
        <div id="upNextList" class="up-next-list"></div>
      </aside>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
